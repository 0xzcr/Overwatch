# fly launch --config fly.indexer.toml --dockerfile Dockerfile.worker --build-arg APP=indexer
app = "overwatch-indexer"
primary_region = "syd" # next to the Supabase database (ap-southeast-2)
[build]
  dockerfile = "Dockerfile.worker"
  [build.args]
    APP = "indexer"
# Restart on any exit, including the watchdog's exit in apps/indexer/src/main.ts.
[[restart]]
  policy = "always"
[[services]]
  internal_port = 8787
  protocol = "tcp"
  # Nothing sends it traffic, so never let Fly stop it as idle.
  auto_stop_machines = "off"
  min_machines_running = 1
  [[services.http_checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
[mounts]
  source = "overwatch_keys"
  destination = "/app/keys"
