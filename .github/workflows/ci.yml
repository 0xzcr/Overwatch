name: ci
on: [push, pull_request]
jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: overwatch, POSTGRES_PASSWORD: overwatch, POSTGRES_DB: overwatch }
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://overwatch:overwatch@localhost:5433/overwatch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm smoke:pipeline
  programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana + Anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/solana-foundation/anchor --tag v1.1.2 anchor-cli --locked
      # keypairs are not committed, so skip the ID check; demo_protocol is not an Anchor program (no IDL)
      - run: anchor build --ignore-keys -p overwatch_registry
      - run: anchor build --ignore-keys -p overwatch_vault
      - run: cargo test -p overwatch_registry -p overwatch_vault
