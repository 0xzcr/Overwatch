services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: overwatch, POSTGRES_PASSWORD: overwatch, POSTGRES_DB: overwatch }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # The whole indexer on one machine with no hosted services: `docker compose up -d`, then `pnpm db:migrate` and
  # `pnpm seed` once (against DATABASE_URL=postgres://overwatch:overwatch@localhost:5433/overwatch).
  indexer:
    build: { context: ., dockerfile: Dockerfile.worker, args: { APP: indexer } }
    restart: always
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://overwatch:overwatch@postgres:5432/overwatch?sslmode=disable
      DIRECT_URL: postgres://overwatch:overwatch@postgres:5432/overwatch?sslmode=disable
    depends_on: [postgres]
    ports: ["8787:8787"]
    volumes: ["./keys:/app/keys:ro"]
volumes: { pgdata: {} }
